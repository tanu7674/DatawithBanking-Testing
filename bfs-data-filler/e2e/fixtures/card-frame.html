<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>body{background:#fff;margin:0}</style></head>
<body>
  <div class="grid">
    <label>Card number<input id="cc" autocomplete="cc-number" inputmode="numeric" maxlength="23"></label>
    <label>Name on card<input id="ccname" autocomplete="cc-name"></label>
    <label>Expiry date<input id="exp" placeholder="MM/YY" maxlength="5"></label>
    <label>Security code (CVV)<input id="cvv" maxlength="4"></label>
  </div>
</body>
</html>
