<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open a Savings Account · Demo Bank India</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>Demo Bank India <small>KYC – test fixture</small></header>
  <main>
    <form id="kyc">
      <fieldset>
        <legend>Customer details</legend>
        <div class="grid">
          <label>Full name<input name="customer_name" required></label>
          <label>PAN<input name="pan_no" maxlength="10" required></label>
          <label>Aadhaar number<input name="aadhaar" maxlength="14" required></label>
          <label>Date of birth<input name="dob" placeholder="DD/MM/YYYY" required></label>
          <label>Mobile number<input name="mobile" type="tel" maxlength="10" required></label>
          <label>Email ID<input name="emailId" type="email" required></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Address</legend>
        <div class="grid">
          <label>Address<input name="addr1" required></label>
          <label>City<input name="city" required></label>
          <label>State
            <select name="state" required>
              <option value="">Select state</option>
              <option>Delhi</option><option>Karnataka</option><option>Maharashtra</option><option>Rajasthan</option>
              <option>Tamil Nadu</option><option>Telangana</option><option>West Bengal</option>
            </select>
          </label>
          <label>PIN code<input name="pincode" maxlength="6" required></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Bank and business</legend>
        <div class="grid">
          <label>Bank account number<input name="acct_no" required></label>
          <label>IFSC code<input name="ifsc" maxlength="11" required></label>
          <label>GSTIN (optional)<input name="gstin" maxlength="15"></label>
          <label>UPI ID<input name="vpa"></label>
          <label>Annual income (₹)<input name="income" type="number" min="0" step="1"></label>
          <label>Loan amount (₹)<input name="loanAmt" type="number" min="10000" max="5000000" step="1"></label>
          <label>Tenure (months)<input name="tenure" type="number" min="6" max="84"></label>
          <label>Interest rate (%)<input name="roi" type="number" step="0.01"></label>
        </div>
      </fieldset>
      <label class="inline"><input type="checkbox" name="consent" required> I authorise Demo Bank to fetch my CIBIL report and agree to the terms.</label>
      <p><button type="submit">Submit</button></p>
    </form>
  </main>
</body>
</html>
